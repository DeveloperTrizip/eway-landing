version: 1
frontend:
  phases:
    preBuild:
      commands:
        - yarn install --frozen-lockfile
    build:
      commands:
        - env | grep NEXT || echo "NO NEXT_ vars found"
        - env | grep -e NEXT_SUPPORT_EMAIL >> .env.production
        - cat .env.production
        - yarn build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*