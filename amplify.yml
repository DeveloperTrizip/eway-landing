version: 1
frontend:
  phases:
    preBuild:
      commands:
        - yarn install --frozen-lockfile
    build:
      commands:
        - echo "Checking env vars..."
        - env | grep NEXT || echo "NO NEXT_ vars found"
        - test -n "$NEXT_SUPPORT_EMAIL_USER" || (echo "ERROR: Set NEXT_SUPPORT_EMAIL_* in Amplify environment variables" && exit 1)
        - env | grep -e NEXT_SUPPORT_EMAIL >> .env.production
        - yarn build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*